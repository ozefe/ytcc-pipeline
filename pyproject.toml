[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ytcc-pipeline"
version = "0.1.0"
description = "PDF processing pipeline for academic theses."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Özyay", email = "hi@efe.cv" }]
keywords = [
  "pdf",
  "ocr",
  "layout-analysis",
  "document-understanding",
  "formula-recognition",
  "table-extraction",
  "grobid",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "pdf-oxide==0.3.47",
  "rapidocr==3.8.1",
  "rapid-table==3.0.2",
  "onnxruntime-gpu==1.26.0",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=5,<6",
  "safetensors>=0.4,<1",
  "huggingface-hub>=1,<2",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  # `ftfy` is used by `transformers.PPFormulaNetProcessor.post_process` to
  # normalize unicode and collapse outer-brace whitespace in recognized LaTeX.
  "ftfy>=6.3,<7",
]

[project.urls]
homepage = "https://github.com/ozefe/ytcc-pipeline"
source   = "https://github.com/ozefe/ytcc-pipeline"
issues   = "https://github.com/ozefe/ytcc-pipeline/issues"

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-xdist>=3,<4",
  # Test-only synthetic image fixtures. Production loads images via cv2.
  "Pillow>=11,<13",
  # HTTP client for FastAPI TestClient and API smoke tests.
  "httpx>=0.27,<1",
]
lint = ["ruff>=0.6,<1"]
typing = ["pyright>=1.1.380,<2"]
benchmarks = [
  # Process-tree CPU/RSS + device-wide VRAM sampling for benchmarks.
  "psutil>=6,<8",
  "nvidia-ml-py>=12,<13",
  "httpx>=0.27,<1",
  # Plotting + CSV -> DataFrame for the knob-sweep benchmark suite.
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<1",
  "pandas>=2.2,<4",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.20,<1",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typing" },
  { include-group = "benchmarks" },
  { include-group = "api" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/ytcc_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "benchmarks",
  "docs",
  "examples",
  "samples",
  "src/ytcc_pipeline",
  "tests",
  "config.toml",
  "LICENSE",
  "pyproject.toml",
  "README.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "integration: end-to-end tests against real PDFs (slow; opt in with `-m integration`)",
  "gpu: tests requiring CUDA (skipped if unavailable)",
  "slow: tests that download large models or run real inference",
]

[tool.pyright]
# Strict on src/ and tests/. Benchmarks and scripts are excluded -- they use
# untyped third-party APIs that don't repay strict typing.
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  ".venv",
  "benchmarks",
  "scripts",
  "examples",
  "docker",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
useLibraryCodeForTypes = true

# Library-boundary noise: the "unknown" diagnostics globally muted so the
# remaining errors are about our code, not the partial third-party stubs.
reportMissingTypeStubs     = "none"
reportUnknownMemberType    = "none"
reportUnknownArgumentType  = "none"
reportUnknownVariableType  = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType    = "none"
reportPrivateUsage         = "none"
# Real-bug checks kept at error severity.
reportMissingImports           = "error"
reportInvalidTypeArguments     = "error"
reportGeneralTypeIssues        = "error"
reportPrivateImportUsage       = "error"
reportUntypedFunctionDecorator = "error"
reportUnnecessaryComparison    = "error"
reportSelfClsParameterName     = "error"

[tool.ruff]
fix            = true    # auto-apply safe fixes
show-fixes     = true    # log every applied fix
target-version = "py314" # warn on features unavailable in 3.14

[tool.ruff.format]
docstring-code-format = true # reformat code snippets inside docstrings

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "T20",    # print() is fine
  "D203",   # incorrect-blank-line-before-class - conflicts with D211
  "D213",   # multi-line-summary-second-line    - conflicts with D212
  "D107",   # __init__ doesn't need a docstring
  "COM812", # missing-trailing-comma - conflicts with `ruff format`
  "ISC001", # single-line-implicit-string-concatenation - conflicts with `ruff format`
  "CPY001", # LICENSE file already covers the copyright
]
task-tags = ["TODO", "FIXME", "XXX", "HACK"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # *args/**kwargs may use Any without annotation

[tool.ruff.lint.flake8-builtins]
strict-checking = true # compare module names, not full paths (A005)

[tool.ruff.lint.pycodestyle]
max-doc-length = 88 # documentation line length (W505)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",     # over-annotating tests hurts readability
  "BLE001",  # catching blind exceptions are normal in test code
  "D",       # docstrings on every test function are noise
  "EM101",   # short string literals in `raise` are fine in tests
  "EM102",   # f-string in `raise` is fine in tests
  "FBT001",  # tests pass booleans positionally
  "INP001",  # tests/ is intentionally not a package
  "PLR2004", # magic-number compares are normal in test code
  "PLC0415", # imports outside top-level are normal in test code
  "S101",    # `assert` is the point in pytest
  "SLF001",  # tests legitimately exercise `_private` attrs
  "TRY003",  # exact messages are part of the test's assertion
  "TRY301",  # `raise` inside `try` is fine in tests that exercise it
]
"examples/**/*.py" = [
  "PLR2004", # magic-number compares are normal in example code
  "INP001",  # examples/ is not a package
  "D",       # example scripts explain themselves in prose, not docstrings
]
"docker/**/*.py" = [
  "INP001", # docker/ is a build-time scripts directory, not a package
]
